    <!-- Loaded as real <link> tags (not a CSS @import) so the browser fetches
         fonts in parallel with everything else instead of blocking on them. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" />

    <!-- Paints the dark background/text color immediately, before the bundled
         stylesheet or fonts have loaded, so there's no flash of the browser's
         default white background on first paint. -->
    <style>
      html { background: #030712; color-scheme: dark; }
      body { margin: 0; background: #030712; color: #f4f6fb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
